<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QuickNotes</title>
    <link rel="stylesheet" href="style.css">
    <script src="api.js" defer></script>
</head>

<body>

    <div class="container">
        <header>
            <h1>Welcome to QuickNotes</h1>
            <p class="subtitle"> Capture your notes with ease</p>
        </header>

        <main>
            <section class="card">
                <div class="actions">
                    <button id="load-btn" type="button">Load Notes</button>
                </div>
                <p id="status" class="status-message"></p>
            </section>

            <section class="card">
                <h2>Create a New Note</h2>
                <form id="note-form" novalidate>
                    <div class="form-group">
                        <label for="title-input">Title</label>
                        <input type="text" name="title" id="title-input" maxlength="100"
                            placeholder="Enter Your Note Title..." required>
                        <small class="char-count"><span id="title-count">0</span>/100</small>
                    </div>
                    <div class="form-group">
                        <label for="body-input">Body</label>
                        <textarea id="body-input" name="body" rows="4"
                            placeholder="Enter note details (optional)"></textarea>
                    </div>

                    <button id="submit-btn" type="submit">Create Note</button>
                </form>
            </section>

            <section class="card">
                <h2>Your Notes</h2>
                <ul id="notes-list" class="notes-list"></ul>
            </section>
        </main>
    </div>

    <footer>&copy; 2026 QuickNotes. All Rights Reserved</footer>

</body>

</html>
